<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ action }} Member - ELITE Treasury</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-2xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-blue-800 mb-6">{{ action }} Member</h1>
        
        <form method="POST" class="bg-white p-6 rounded-lg shadow space-y-4">
            {% csrf_token %} <!-- Security feature ng Django -->
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Member ID</label>
                {{ form.member_id }}
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    {{ form.first_name }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    {{ form.last_name }}
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                    {{ form.department }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Year Level</label>
                    {{ form.year_level }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Section</label>
                    {{ form.section }}
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Team</label>
                    {{ form.team }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    {{ form.status }}
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4">
                <a href="{% url 'member_list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
                    Cancel
                </a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Save Member
                </button>
            </div>
        </form>
    </div>
</body>
</html>
