<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Record Contribution - ELITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-2xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-green-800 mb-6">Record Contribution</h1>
        
        <form method="POST" class="bg-white p-6 rounded-lg shadow space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Member</label>
                {{ form.member }}
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contribution Type</label>
                    {{ form.contribution_type }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₱)</label>
                    {{ form.amount }}
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Payment Date</label>
                    {{ form.payment_date }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Reference No.</label>
                    {{ form.reference_no }}
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                {{ form.notes }}
            </div>

            <div class="flex justify-end space-x-3 pt-4">
                <a href="{% url 'treasury_ledger' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
                    Cancel
                </a>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                    Save Contribution
                </button>
            </div>
        </form>
    </div>
</body>
</html>
